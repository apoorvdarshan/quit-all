# TEMPORARY (branch only, removed before merge): a copy of ios-release.yml at the
# path GitHub already registered on main, so the validation run can be dispatched
# on this branch before ios-release.yml exists on the default branch.
# iOS release — GitHub Actions builds, signs and uploads the App Store binary,
# and creates the GitHub Release for the tag.
#
# Xcode Cloud is being removed for Quit All and must not be re-created: its
# tag-triggered workflow is configured in App Store Connect, independently of
# this file. While one exists for v* tags, keep IOS_UPLOAD_BUILD off, or both
# pipelines would upload a build for the same tag.
#
# Trigger
#   push tag vX.Y.Z     release run (the tag must equal MARKETING_VERSION exactly)
#   workflow_dispatch   validation run: archive, sign, export and validate the
#                       IPA with App Store Connect. Never uploads, never touches
#                       the App Store listing, review or GitHub Releases. The
#                       optional marketing_version input validates as a not-yet-
#                       approved version (Apple refuses already-approved ones).
#
# Switches (repository Variables; missing = off, invalid values fail the run).
# See store/README.md for the full table.
#   IOS_RELEASE_AUTOMATION   master switch for every iOS store operation below
#   IOS_UPLOAD_BUILD         build + upload the binary to App Store Connect
#   IOS_UPLOAD_LISTING       description, keywords, promo text, URLs
#   IOS_UPLOAD_WHATS_NEW     What's New text
#   IOS_UPLOAD_SCREENSHOTS   iPhone 6.7"/6.9" and 6.5" screenshots
#   IOS_SUBMIT_REVIEW        select THIS run's processed build, submit for review
#                            (needs IOS_UPLOAD_BUILD; never uses an older build)
#   IOS_PUBLIC_RELEASE       release automatically after approval (else manual)
#   IOS_BUILD_POLL_SECONDS   default 30   (10–600)
#   IOS_BUILD_WAIT_MINUTES   default 120  (10–300), counted from upload start,
#                            covering upload + App Store Connect processing
#
# Secrets
#   APP_STORE_CONNECT_API_KEY_ID / _ISSUER_ID / _API_KEY_P8
#       Admin-role key: build numbers, cloud-managed distribution signing,
#       upload, build readiness, listing and review.
#   IOS_DEV_SIGNING_P12_BASE64 / IOS_DEV_SIGNING_P12_PASSWORD
#       Shared CI Apple Development identity ("Apple Development: Created via
#       API", certificate NVNGDQGCKK, expires 2027-10-14) used only to sign the
#       archive; distribution signing at export is cloud-managed by Apple.

name: iOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      marketing_version:
        description: >-
          Validation only: version to validate as (e.g. 1.2.2). Empty = the project
          version. Apple rejects versions already approved, so use the next one.
        required: false
        default: ""

permissions:
  contents: read

# Build numbers come from App Store Connect, so tag release runs never overlap.
# Manual validation runs get their own group and can never cancel a release run.
concurrency:
  group: ios-release-${{ github.event_name == 'push' && 'release' || github.run_id }}
  cancel-in-progress: false

env:
  BUNDLE_ID: com.apoorvdarshan.Quit-All
  WIDGET_BUNDLE_ID: com.apoorvdarshan.Quit-All.Widget
  APP_GROUP: group.com.apoorvdarshan.quitall
  TEAM_ID: 23RV7FYH36

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.gates.outputs.mode }}
      build: ${{ steps.gates.outputs.build }}
      upload_build: ${{ steps.gates.outputs.upload_build }}
      listing: ${{ steps.gates.outputs.listing }}
      whats_new: ${{ steps.gates.outputs.whats_new }}
      screenshots: ${{ steps.gates.outputs.screenshots }}
      submit: ${{ steps.gates.outputs.submit }}
      public_release: ${{ steps.gates.outputs.public_release }}
      asc: ${{ steps.gates.outputs.asc }}
      poll_seconds: ${{ steps.gates.outputs.poll_seconds }}
      wait_minutes: ${{ steps.gates.outputs.wait_minutes }}
      marketing_version: ${{ steps.gates.outputs.marketing_version }}
      build_number: ${{ steps.number.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/store/
            /scripts/release_notes.py
            /store/
            /RELEASE_NOTES.md
            /requirements-store.txt
            /ios/Quit All.xcodeproj/project.pbxproj
            /ios/Quit All/Core/PaywallManager.swift
            /ios/Quit All/Products.storekit
            /marketing/1260x2736/
            /marketing/1242x2688/

      - name: Install store tooling (hash-pinned)
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-store.txt

      # These checks pass before anything reaches App Store Connect.
      - name: Check release notes and store automation (release runs)
        if: github.event_name == 'push'
        run: |
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" > /dev/null
          python3 -m unittest scripts/store/test_ios_release.py

      - name: Resolve iOS release switches
        id: gates
        env:
          IOS_RELEASE_AUTOMATION: ${{ vars.IOS_RELEASE_AUTOMATION }}
          IOS_UPLOAD_BUILD: ${{ vars.IOS_UPLOAD_BUILD }}
          IOS_UPLOAD_LISTING: ${{ vars.IOS_UPLOAD_LISTING }}
          IOS_UPLOAD_WHATS_NEW: ${{ vars.IOS_UPLOAD_WHATS_NEW }}
          IOS_UPLOAD_SCREENSHOTS: ${{ vars.IOS_UPLOAD_SCREENSHOTS }}
          IOS_SUBMIT_REVIEW: ${{ vars.IOS_SUBMIT_REVIEW }}
          IOS_PUBLIC_RELEASE: ${{ vars.IOS_PUBLIC_RELEASE }}
          IOS_BUILD_POLL_SECONDS: ${{ vars.IOS_BUILD_POLL_SECONDS }}
          IOS_BUILD_WAIT_MINUTES: ${{ vars.IOS_BUILD_WAIT_MINUTES }}
          VALIDATION_MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: python3 scripts/store/ios_release.py gates

      - name: Check listing inputs for the enabled switches
        if: steps.gates.outputs.asc == 'true'
        env:
          UPLOAD_LISTING: ${{ steps.gates.outputs.listing }}
          UPLOAD_WHATS_NEW: ${{ steps.gates.outputs.whats_new }}
          UPLOAD_SCREENSHOTS: ${{ steps.gates.outputs.screenshots }}
          SUBMIT_IOS_REVIEW: ${{ steps.gates.outputs.submit }}
          PUBLIC_RELEASE: ${{ steps.gates.outputs.public_release }}
          MARKETING_VERSION: ${{ steps.gates.outputs.marketing_version }}
        run: |
          # Offline: fails now (before tests or a build) on stale What's New text,
          # missing screenshots or over-long listing fields.
          python3 scripts/store/asc_release.py --dry-run --version "$MARKETING_VERSION" \
            --build-id CHECK --build-number 0

      - name: Choose the build number
        id: number
        if: steps.gates.outputs.build == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: python3 scripts/store/ios_release.py build-number

  # A tag release is built from a commit whose unit and UI tests pass.
  tests:
    needs: prepare
    if: github.event_name == 'push'
    uses: ./.github/workflows/ios-tests.yml
    permissions:
      contents: read

  build:
    needs: [prepare, tests]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.build == 'true' &&
      (needs.tests.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.tests.result == 'skipped'))
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      MODE: ${{ needs.prepare.outputs.mode }}
      MARKETING_VERSION: ${{ needs.prepare.outputs.marketing_version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    outputs:
      upload_started_at: ${{ steps.upload.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ios/
            !/ios/screenshots/
            /scripts/store/verify_ios_bundles.sh

      # Source checkouts of the pinned packages only; the build itself is never cached.
      - name: Cache pinned Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ios-release-packages
          key: ios-release-spm-${{ runner.os }}-${{ runner.arch }}-xcode27-${{ hashFiles('ios/**/Package.resolved') }}

      - name: Check toolchain and inputs
        run: |
          xcodebuild -version
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "error: no build number from prepare job" >&2; exit 1; }
          [[ "$MARKETING_VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "error: bad marketing version" >&2; exit 1; }
          case "$DEVELOPER_DIR" in *beta*|*Beta*) echo "error: App Store builds need a released Xcode" >&2; exit 1 ;; esac

      - name: Install signing identity and App Store Connect key
        env:
          P12_BASE64: ${{ secrets.IOS_DEV_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DEV_SIGNING_P12_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in P12_BASE64 P12_PASSWORD ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!name}" ] || { echo "error: missing signing secret $name" >&2; exit 1; }
          done
          umask 077
          keys="$RUNNER_TEMP/asc-keys"
          mkdir -p "$keys"
          python3 -c 'import os,sys; open(sys.argv[1],"w").write(os.environ["ASC_KEY_P8"].replace("\\n","\n").strip()+"\n")' \
            "$keys/AuthKey_${ASC_KEY_ID}.p8"
          keychain="$RUNNER_TEMP/quitall-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # Apple's WWDR G3 intermediate completes the development identity's chain.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr-g3.cer"
          echo "dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f  $RUNNER_TEMP/wwdr-g3.cer" | shasum -a 256 -c -
          security import "$RUNNER_TEMP/wwdr-g3.cer" -k "$keychain" > /dev/null
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          read -r -a existing <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security find-identity -v -p codesigning "$keychain" | tee "$RUNNER_TEMP/identities.txt"
          grep -qE '[1-9][0-9]* valid identit' "$RUNNER_TEMP/identities.txt" || { echo "error: no valid signing identity in the CI keychain" >&2; exit 1; }
          {
            echo "ASC_KEY_PATH=$keys/AuthKey_${ASC_KEY_ID}.p8"
            echo "API_PRIVATE_KEYS_DIR=$keys"
            echo "SIGNING_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Archive Release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          log="$RUNNER_TEMP/logs/archive.log"
          status=0
          xcodebuild archive \
            -project "ios/Quit All.xcodeproj" \
            -scheme "Quit All" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/QuitAll.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            -clonedSourcePackagesDirPath .ios-release-packages \
            -onlyUsePackageVersionsFromResolvedFile \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" > "$log" 2>&1 || status=$?
          grep -E '(error|warning): |\*\* ARCHIVE' "$log" || true
          [ "$status" -eq 0 ] || { tail -n 60 "$log"; echo "error: archive failed (full log in artifact)" >&2; exit "$status"; }

      - name: Verify app and widget identity, version and app group in the archive
        run: |
          set -euo pipefail
          apps="$RUNNER_TEMP/QuitAll.xcarchive/Products/Applications"
          bash scripts/store/verify_ios_bundles.sh "$apps" archive

      - name: Write export options
        run: |
          set -euo pipefail
          for destination in export upload; do
            cat > "$RUNNER_TEMP/ExportOptions-$destination.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>${destination}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
            plutil -lint "$RUNNER_TEMP/ExportOptions-$destination.plist"
          done

      # Both modes export an App Store-signed IPA locally first, so the signed app
      # and widget are verified before anything is validated or uploaded.
      - name: Export with cloud-managed App Store signing
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/logs/export.log"
          status=0
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/QuitAll.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$log" 2>&1 || status=$?
          grep -E '(error|warning): |\*\* EXPORT' "$log" || true
          [ "$status" -eq 0 ] || { tail -n 60 "$log"; echo "error: export failed (full log in artifact)" >&2; exit "$status"; }
          ipa="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n1)"
          [ -n "$ipa" ] || { echo "error: export produced no IPA" >&2; exit 1; }
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

      - name: Verify the App Store-signed app and widget
        run: |
          set -euo pipefail
          unpacked="$RUNNER_TEMP/ipa"
          rm -rf "$unpacked"
          ditto -x -k "$IPA_PATH" "$unpacked"
          bash scripts/store/verify_ios_bundles.sh "$unpacked/Payload" distribution

      - name: Validate with App Store Connect (validation run)
        if: env.MODE == 'validate'
        run: |
          set -euo pipefail
          xcrun altool --validate-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/logs/validate.log"
          echo "validated $MARKETING_VERSION ($BUILD_NUMBER) with App Store Connect — nothing uploaded"

      - name: Upload to App Store Connect (release run)
        id: upload
        if: env.MODE == 'release'
        run: |
          set -euo pipefail
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
          log="$RUNNER_TEMP/logs/upload.log"
          status=0
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/QuitAll.xcarchive" \
            -exportPath "$RUNNER_TEMP/upload" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$log" 2>&1 || status=$?
          grep -E '(error|warning): |[Uu]pload|\*\* EXPORT' "$log" || true
          [ "$status" -eq 0 ] || { tail -n 60 "$log"; echo "error: upload failed (full log in artifact)" >&2; exit "$status"; }
          echo "uploaded $MARKETING_VERSION ($BUILD_NUMBER); App Store Connect processing is checked next"

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          find "${TMPDIR:-/tmp}" -maxdepth 1 -name '*.xcdistributionlogs' -exec cp -R {} "$RUNNER_TEMP/logs/" \; 2>/dev/null || true

      - name: Keep build logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-release-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/logs
          retention-days: 7
          if-no-files-found: ignore

      - name: Remove signing material
        if: always()
        run: |
          [ -n "${SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc-keys" "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/export" "$RUNNER_TEMP/upload" \
            "$RUNNER_TEMP/ipa" "$RUNNER_TEMP/wwdr-g3.cer"

  app-store-connect:
    needs: [prepare, tests, build]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.mode == 'release' &&
      needs.tests.result == 'success' &&
      (needs.prepare.outputs.upload_build == 'true' || needs.prepare.outputs.asc == 'true') &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && needs.prepare.outputs.upload_build != 'true'))
    runs-on: ubuntu-latest
    # Covers IOS_BUILD_WAIT_MINUTES (max 300) plus listing, screenshots and submission.
    timeout-minutes: 345
    env:
      MARKETING_VERSION: ${{ needs.prepare.outputs.marketing_version }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/store/
            /store/
            /requirements-store.txt
            /marketing/1260x2736/
            /marketing/1242x2688/

      - name: Install store tooling (hash-pinned)
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-store.txt

      - name: Wait for App Store Connect to process this build
        id: wait
        if: needs.prepare.outputs.upload_build == 'true'
        run: |
          python3 scripts/store/ios_release.py wait-build \
            --version "$MARKETING_VERSION" \
            --build "${{ needs.prepare.outputs.build_number }}" \
            --started-at "${{ needs.build.outputs.upload_started_at }}" \
            --wait-minutes "${{ needs.prepare.outputs.wait_minutes }}" \
            --poll-seconds "${{ needs.prepare.outputs.poll_seconds }}"

      - name: Listing / What's New / screenshots / review (gated)
        if: needs.prepare.outputs.asc == 'true'
        env:
          UPLOAD_LISTING: ${{ needs.prepare.outputs.listing }}
          UPLOAD_WHATS_NEW: ${{ needs.prepare.outputs.whats_new }}
          UPLOAD_SCREENSHOTS: ${{ needs.prepare.outputs.screenshots }}
          SUBMIT_IOS_REVIEW: ${{ needs.prepare.outputs.submit }}
          PUBLIC_RELEASE: ${{ needs.prepare.outputs.public_release }}
          BUILD_ID: ${{ steps.wait.outputs.build_id }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          set -euo pipefail
          args=(--version "$MARKETING_VERSION")
          if [ -n "$BUILD_ID" ]; then
            args+=(--build-id "$BUILD_ID" --build-number "$BUILD_NUMBER")
          fi
          python3 scripts/store/asc_release.py "${args[@]}"

  github-release:
    needs: [prepare, tests, build, app-store-connect]
    if: >-
      !cancelled() && github.event_name == 'push' &&
      needs.prepare.result == 'success' && needs.tests.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.app-store-connect.result == 'success' || needs.app-store-connect.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/release_notes.py
            /scripts/store/print_gates.py
            /RELEASE_NOTES.md
            /ios/Quit All.xcodeproj/project.pbxproj

      - name: Print store switches
        env:
          IOS_RELEASE_AUTOMATION: ${{ vars.IOS_RELEASE_AUTOMATION }}
          IOS_UPLOAD_BUILD: ${{ vars.IOS_UPLOAD_BUILD }}
          IOS_UPLOAD_LISTING: ${{ vars.IOS_UPLOAD_LISTING }}
          IOS_UPLOAD_WHATS_NEW: ${{ vars.IOS_UPLOAD_WHATS_NEW }}
          IOS_UPLOAD_SCREENSHOTS: ${{ vars.IOS_UPLOAD_SCREENSHOTS }}
          IOS_SUBMIT_REVIEW: ${{ vars.IOS_SUBMIT_REVIEW }}
          IOS_PUBLIC_RELEASE: ${{ vars.IOS_PUBLIC_RELEASE }}
          IOS_BUILD_POLL_SECONDS: ${{ vars.IOS_BUILD_POLL_SECONDS }}
          IOS_BUILD_WAIT_MINUTES: ${{ vars.IOS_BUILD_WAIT_MINUTES }}
        run: python3 scripts/store/print_gates.py --platform ios

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOADED_BUILD: ${{ needs.build.result == 'success' && needs.prepare.outputs.build_number || '' }}
        run: |
          set -euo pipefail
          build="${UPLOADED_BUILD:-$(grep -m1 'CURRENT_PROJECT_VERSION' "ios/Quit All.xcodeproj/project.pbxproj" | tr -dc '0-9')}"
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          notes=(--generate-notes)
          [ -s "$RUNNER_TEMP/release-notes.md" ] && notes=(--notes-file "$RUNNER_TEMP/release-notes.md")
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Quit All $GITHUB_REF_NAME (build $build)" \
            --verify-tag --latest "${notes[@]}"
