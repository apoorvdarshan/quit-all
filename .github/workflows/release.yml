name: Release

# Create a GitHub Release automatically whenever a version tag (v*) is pushed.
# Pushing the tag also triggers the Xcode Cloud build; this just adds the
# GitHub Release (with auto-generated notes) alongside it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so release notes can diff from the previous tag

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Quit All $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
