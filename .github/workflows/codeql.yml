# Static analysis (SAST) with GitHub CodeQL on every pull request, push to main
# and weekly:
#
#   javascript-typescript  web/ (site build, page script and the KLIPY / app-config API Worker)
#   python                 scripts/ (release notes and App Store release tooling)
#   actions                .github/workflows/*.yml
#
# Each job checks out only the directories its language lives in, so no job
# downloads the marketing media or screenshots. The Swift app is analyzed by
# codeql-swift.yml on a macOS runner.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Mondays.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older analysis; pushes to main, the
# weekly schedule and manual runs never are.
concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            sparse-checkout: |
              /web/
          - language: python
            sparse-checkout: |
              /scripts/
          - language: actions
            sparse-checkout: |
              /.github/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ matrix.sparse-checkout }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
