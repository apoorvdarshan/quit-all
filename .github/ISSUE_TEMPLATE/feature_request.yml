name: Feature request
description: Suggest an idea or enhancement for Quit All
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. A clear problem statement helps more than a solution alone.
        Check [existing issues](https://github.com/apoorvdarshan/quit-all/issues) first to avoid duplicates.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - iOS app
        - Widget
        - Website (quit-all.com)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Quit All to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, screenshots or links are welcome.
