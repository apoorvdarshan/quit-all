# Dependabot version updates for the app's Swift package and the CI and release
# tooling. Dependabot security alerts are enabled separately, in the repository
# settings.
#
#   github-actions  the commit-SHA-pinned actions in .github/workflows
#   pip             the hash-locked store tooling (requirements-store.in compiled
#                   to requirements-store.txt) that runs with the App Store
#                   Connect key in the release jobs
#   npm /web        the website and KLIPY proxy deployed to Cloudflare Workers
#   swift           the RevenueCat SDK (purchases-ios-spm), pinned in the Xcode
#                   project's Package.resolved under ios/Quit All.xcodeproj.
#                   Dependabot finds the project in /ios without a Package.swift
#                   and updates Package.resolved and the minimum version in
#                   project.pbxproj together.
#
# GitHub's dependency graph does not list that Swift package (checked
# 2026-10-14), so Dependabot alerts cannot flag a vulnerable RevenueCat version;
# these version updates are what keep it current.
#
# Monthly, one grouped pull request per ecosystem: a Swift package bump, and an
# actions bump that touches ios-tests.yml, each run the iOS unit and UI tests on
# a macOS runner, once on the pull request and again on main.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      store-tooling:
        patterns: ["*"]
    commit-message:
      prefix: "Store tooling"

  - package-ecosystem: swift
    directory: /ios
    schedule:
      interval: monthly
    groups:
      swift-packages:
        patterns: ["*"]
    commit-message:
      prefix: "iOS"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # Next.js 16.4 builds but fails at runtime on Cloudflare Workers with
      # OpenNext 1.20.11 ("Unexpected loadManifest(preview-props.json) call",
      # opennextjs/opennextjs-cloudflare#1448). Stay on 16.3.x, which still gets
      # patch releases, until that is fixed.
      - dependency-name: next
        versions: [">=16.4.0"]
      - dependency-name: eslint-config-next
        versions: [">=16.4.0"]
    commit-message:
      prefix: "Web"
