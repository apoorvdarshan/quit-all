# Dependabot version updates for the app's Swift package and the CI and release
# tooling. Dependabot security alerts are enabled separately, in the repository
# settings.
#
#   github-actions  the commit-SHA-pinned actions in .github/workflows, and the
#                   store-release pin of the release callers (ios-release.yml and
#                   store-checks.yml), which gets a PR of its own
#   npm /web        the website build and test tooling (wrangler, TypeScript, ESLint)
#   swift           the RevenueCat SDK (purchases-ios-spm), pinned in the Xcode
#                   project's Package.resolved under ios/Quit All.xcodeproj.
#                   Dependabot finds the project in /ios without a Package.swift
#                   and updates Package.resolved and the minimum version in
#                   project.pbxproj together.
#
# GitHub's dependency graph does not list that Swift package (checked
# 2026-10-14), so Dependabot alerts cannot flag a vulnerable RevenueCat version;
# these version updates are what keep it current.
#
# Monthly, one grouped pull request per ecosystem: a Swift package bump, and an
# actions bump that touches ios-tests.yml, each run the iOS unit and UI tests on
# a macOS runner, once on the pull request and again on main.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # The release callers' pins (one SHA in both files, with its "# vX.Y.Z"
      # comment). Declared before the catch-all: a dependency joins the first group
      # it matches, so a store-release bump always gets its own PR.
      store-release:
        patterns: ["apoorvdarshan/store-release*"]
      github-actions:
        patterns: ["*"]
    # store-release pins run with the app's signing and App Store Connect
    # credentials: a new release waits seven days before Dependabot proposes it.
    # Security updates are never delayed by a cooldown.
    cooldown:
      default-days: 7
      include: ["apoorvdarshan/store-release*"]
    commit-message:
      prefix: "CI"

  # The store release tooling and its hash-locked Python dependencies live in
  # apoorvdarshan/store-release, which keeps them up to date; the store-release
  # group above moves this repository to each new release.

  - package-ecosystem: swift
    directory: /ios
    schedule:
      interval: monthly
    groups:
      swift-packages:
        patterns: ["*"]
    commit-message:
      prefix: "iOS"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # Keep the Node types on the major version CI and the engines field use (24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports only TypeScript below 6.1, so a TypeScript
      # major (7 in #44 and #48) fails npm ci. Bump it by hand together with a
      # typescript-eslint release that supports the new major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "Web"
